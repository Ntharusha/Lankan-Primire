apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lankan-primire-backend-hpa
  namespace: lankan-primire
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lankan-primire-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
