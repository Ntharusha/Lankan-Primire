apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lankan-primire-ingress
  namespace: lankan-primire
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "lankan-primire-backend-service"
spec:
  rules:
  - host: lankan-primire.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: lankan-primire-backend-service
            port:
              number: 5000
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: lankan-primire-backend-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lankan-primire-frontend-service
            port:
              number: 80
