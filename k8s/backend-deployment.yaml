apiVersion: apps/v1
kind: Deployment
metadata:
  name: lankan-primire-backend
  namespace: lankan-primire
  labels:
    app: lankan-primire-backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lankan-primire-backend
  template:
    metadata:
      labels:
        app: lankan-primire-backend
        tier: api
    spec:
      containers:
      - name: backend
        image: lankan-primire-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - configMapRef:
            name: lankan-primire-config
        - secretRef:
            name: lankan-primire-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lankan-primire-backend-service
  namespace: lankan-primire
  labels:
    app: lankan-primire-backend
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: lankan-primire-backend
